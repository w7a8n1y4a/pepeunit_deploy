services:
  redis:
    image: redis:8.10.3
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  postgres:
    image: postgres:18.6
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run make_env.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make_env.py}
      POSTGRES_DB: ${POSTGRES_DB:?run make_env.py}
      POSTGRES_HOST_AUTH_METHOD: md5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  emqx:
    image: emqx/emqx:6.3.2
    container_name: emqx
    restart: always
    depends_on:
      - redis
    ports:
      - "1883:1883"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${PU_MQTT_USERNAME:?run make_env.py}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${PU_MQTT_PASSWORD:?run make_env.py}
      EMQX_PROMETHEUS__ENABLE_BASIC_AUTH: "false"

  clickhouse:
    image: clickhouse:26.10.3
    container_name: clickhouse
    restart: always
    ports:
      - 8123:8123
      - 9000:9000
      - 9009:9009
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./data/clickhouse/disable_system_logs.xml:/etc/clickhouse-server/config.d/disable_system_logs.xml:ro
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?run make_env.py}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run make_env.py}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:?run make_env.py}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://clickhouse:8123 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: w7a8n1y4a/pepeunit-server:1.5.0
    container_name: backend
    restart: always
    depends_on:
      - redis
      - postgres
      - clickhouse
      - emqx
    ports:
      - "5291:5000"
    volumes:
      - backend_repo_cache:/app/${PU_SAVE_REPO_PATH:-repo_cache}
    # a variable the owner did not set stays unset, the server uses its default
    environment:
      - PU_APP_PREFIX
      - PU_API_V1_PREFIX
      - PU_WORKER_COUNT
      - PU_DOMAIN
      - PU_SECURE
      - PU_SAVE_REPO_PATH
      - PU_PROMETHEUS_MULTIPROC_DIR
      - PU_SECRET_KEY
      - PU_ENCRYPT_KEY
      - PU_SQLALCHEMY_DATABASE_URL
      - PU_CLICKHOUSE_DATABASE_URL
      - PU_REDIS_URL
      - PU_NOTIFICATION_LOKI_URL
      - PU_MQTT_HOST
      - PU_MQTT_SECURE
      - PU_MQTT_PORT
      - PU_MQTT_API_PORT
      - PU_MQTT_USERNAME
      - PU_MQTT_PASSWORD
      - PU_MQTT_REDIS_AUTH_URL
      - PU_GRAFANA_ADMIN_USER
      - PU_GRAFANA_ADMIN_PASSWORD

  frontend:
    image: w7a8n1y4a/pepeunit-client:1.5.0
    container_name: frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5292:80"
    environment:
      INSTANCE_URL: ${INSTANCE_URL:?run make_env.py}

  nginx:
    image: nginx:1.31.8
    container_name: nginx
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./data/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    restart: always
    depends_on:
      - backend
      - emqx
    ports:
      - 9090:9090
    volumes:
      - ./data/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    restart: always
    depends_on:
      - backend
      - prometheus
    ports:
      - 3000:3000
    volumes:
      - ./data/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${PU_GRAFANA_ADMIN_USER:?run make_env.py}
      GF_SECURITY_ADMIN_PASSWORD: ${PU_GRAFANA_ADMIN_PASSWORD:?run make_env.py}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: ${PU_DOMAIN:?run make_env.py}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_LOG_LEVEL: error
      GF_PLUGINS_PREINSTALL_SYNC: yesoreyeram-infinity-datasource,marcusolsson-hourly-heatmap-panel

  logporter:
    image: lifailon/logporter:1.5.1
    container_name: logporter
    restart: always
    ports:
      - "9333:9333"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  loki:
    image: grafana/loki:3.7.9
    container_name: loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./data/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.6.11
    container_name: promtail
    restart: always
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/promtail/config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml

volumes:
  postgres_data: {}
  clickhouse_data: {}
  backend_repo_cache: {}
  grafana_data: {}
  emqx_data: {}
  emqx_log: {}
  loki_data: {}
